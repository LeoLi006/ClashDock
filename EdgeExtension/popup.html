<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClashDock 网站分流</title><link rel="stylesheet" href="popup.css"></head><body>
<header><img src="icon32.png" alt=""><strong>ClashDock</strong><button id="sidebar" title="在侧边栏持续使用">侧边栏 ↗</button><button id="refresh" class="icon" title="只读刷新状态" aria-label="只读刷新状态">↻</button></header>
<main><section class="site"><div class="eyebrow">当前域名及其子域名 · 同域名共用</div><h1 id="domain">正在读取…</h1></section>
<section><div class="segmented" role="group" aria-label="保存的网站选择"><button data-mode="自动" disabled>自动</button><button data-mode="直连" disabled>直连</button><button data-mode="代理" disabled>代理</button></div><p id="intent">正在读取已保存选择</p><strong id="expected">预期出口：尚未读取</strong></section>
<section id="statusBox" class="status"><i></i><div><strong id="status" role="status" aria-live="polite">正在连接…</strong><p id="statusDetail">选择意图与规则核验分别显示。</p><p id="next"></p></div></section>
<div id="notice" role="alert"></div><button id="start" class="primary" hidden>启动 ClashDock</button><button id="retry" class="primary" hidden>重新应用全部分流…</button>
<section id="retryPanel" class="target" hidden><strong>全部分流影响预览</strong><p id="retryScope"></p><div class="tools"><button id="confirmRetry">确认重新应用全部分流</button><button id="cancelRetry">取消</button></div></section>
<div class="tools"><button id="check" disabled>检查分流 ↗</button><button id="reloadTab" disabled>手动刷新网页</button></div>
<details id="more"><summary>节点详情与网站模板</summary><section class="target"><div class="eyebrow">选择代理时使用 · 跟随全局目标</div><div id="target">—</div><p id="time" class="hint">未读取测速记录</p></section><p id="errorDetail" hidden></p><p id="inherit">自动沿用后续应用／订阅规则。</p><p>规则也可能影响其他应用访问此域名；不会自动扩大到主域。没有观察记录不代表未联网；连接链路不是公网 IP。</p><button id="templates" disabled>查看网站模板</button>
<details id="templatePanel"><summary>预览模板包含的域名</summary><select id="templateSelect" aria-label="网站模板"></select><div id="templateDomains"></div><p>资源域名可能被其他网站共用，应用后也影响这些网站。</p><div class="template-actions"><select id="templateMode" aria-label="模板模式"><option>代理</option><option>直连</option><option>自动</option></select><button id="applyTemplate">确认并应用所选域名</button></div></details></details>
<footer>不管理系统代理、TUN 或浏览器代理。不自动刷新或断开旧连接。</footer></main><script src="state.js"></script><script src="popup.js"></script></body></html>
