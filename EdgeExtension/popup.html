<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClashDock 网站分流</title><link rel="stylesheet" href="popup.css"></head><body>
<header><img src="icon32.png" alt=""><div><strong>ClashDock</strong><span>网站分流</span></div><button id="refresh" class="icon" title="刷新状态" aria-label="刷新状态">↻</button></header>
<main><section class="site"><div class="eyebrow">当前域名及其子域名</div><h1 id="domain">正在读取当前网站…</h1><p>同域名标签页共用；也影响其他应用访问此域名。</p></section>
<section><div class="segmented" role="group" aria-label="网站模式"><button data-mode="自动" disabled>自动</button><button data-mode="直连" disabled>直连</button><button data-mode="代理" disabled>代理</button></div><p id="inherit" class="hint">自动沿用后续规则；不是标签页独立代理。</p></section>
<section class="target"><div class="eyebrow">跟随 ClashDock 全局目标</div><div id="target">—</div><p id="time" class="hint">未读取测速记录</p></section>
<section id="statusBox" class="status"><i></i><div><strong id="status" role="status" aria-live="polite">正在连接…</strong><p id="statusDetail">规则状态与实际连接分别核验。</p></div></section>
<div id="notice" role="alert"></div><button id="start" class="primary" hidden>启动 ClashDock</button><button id="retry" class="primary" hidden>重试分流应用</button>
<div class="tools"><button id="templates" disabled>网站模板</button><button id="check" disabled>检查分流 ↗</button><button id="reloadTab" disabled>手动刷新网页</button></div>
<details id="templatePanel"><summary>预览模板包含的域名</summary><select id="templateSelect" aria-label="网站模板"></select><div id="templateDomains"></div><p>资源域名可能被其他网站共用，应用后也影响这些网站。</p><div class="template-actions"><select id="templateMode" aria-label="模板模式"><option>代理</option><option>直连</option><option>自动</option></select><button id="applyTemplate">确认并应用所选域名</button></div></details>
<footer>不管理 TUN 或 Edge 全局代理。直连不保证解决校园网认证。<br>初次使用请按包内《扩展安装指南》注册通信桥。</footer></main>
<script src="state.js"></script><script src="popup.js"></script></body></html>
